name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases for the in-app updater

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core engine)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "cinecascade-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cinecascade-debug-apk
          path: cinecascade-*.apk

      # Each pushed build becomes the "latest" GitHub Release; the app checks it on Wi-Fi.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CineCascade build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: cinecascade-*.apk
          make_latest: true
